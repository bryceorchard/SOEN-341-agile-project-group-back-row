name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Get the code
        uses: actions/checkout@v7
  
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
  
      - name: Install dependencies
        run: npm ci
  
      - name: Run tests with coverage
        run: npm run test:coverage
  
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/CareerConnect
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/CareerConnect/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx ng test --watch=false --coverage

      - name: Build
        run: npm run build

  sonar:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/CareerConnect/package-lock.json

      - name: Backend coverage (LCOV)
        working-directory: backend
        run: |
          npm ci
          mkdir -p coverage
          node --test --experimental-test-coverage --test-coverage-exclude="test/**" \
            --test-reporter=dot --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            test/*.test.js
          # LCOV paths are relative to backend/; SonarQube Cloud reads them from the repo root
          sed -i 's#^SF:#SF:backend/#' coverage/lcov.info

      - name: Frontend coverage (LCOV)
        working-directory: frontend/CareerConnect
        run: |
          npm ci
          npx ng test --watch=false --coverage --coverage-reporters=lcov
          sed -i 's#^SF:#SF:frontend/CareerConnect/#' coverage/CareerConnect/lcov.info

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Scan skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set, so the SonarQube Cloud scan was skipped. Add it under Settings > Secrets and variables > Actions."