# SonarQube Cloud settings (Sprint 4 static analysis, guideline 5.3).
# The two keys must match the project on sonarcloud.io: Project > Information.
sonar.organization=bryceorchard
sonar.projectKey=bryceorchard_SOEN-341-agile-project-group-back-row
sonar.projectName=CareerConnect

# What is analysed. Spec files live next to the code in the frontend, so they are moved
# from "source" to "test" with the inclusion/exclusion pair.
sonar.sources=backend/src,backend/db,backend/scripts,frontend/CareerConnect/src
sonar.tests=backend/test,frontend/CareerConnect/src
sonar.exclusions=frontend/CareerConnect/src/**/*.spec.ts
sonar.test.inclusions=backend/test/**/*.js,frontend/CareerConnect/src/**/*.spec.ts

# Coverage, produced by the "sonar" job in .github/workflows/ci.yml
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/CareerConnect/coverage/CareerConnect/lcov.info

sonar.sourceEncoding=UTF-8
